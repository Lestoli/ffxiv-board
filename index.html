<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFXIV Mechanics Diagrammer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d1f;--panel:#0d1630;--panel2:#111d3d;--line:#1f2f5c;--text:#dbe6ff;--dim:#7f92bf;--accent:#5fd3ff;--danger:#ff5a6a;--ok:#4dff88}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 Inter,system-ui,sans-serif;overflow:hidden}
header{height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0b1430,#0a1028)}
header h1{font:700 19px Rajdhani,sans-serif;letter-spacing:.06em;margin:0 6px 0 0;color:#fff;text-shadow:0 0 12px rgba(95,211,255,.55);white-space:nowrap}
header h1 span{color:var(--accent)}
.sp{flex:1}
.status{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
.status b{font-weight:600}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--dim);vertical-align:1px}
.status.live .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.status.ro .dot{background:#ffd43b}
#avatars{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11px Inter;color:#fff;border:2px solid #0b1430;margin-left:-6px;cursor:pointer;position:relative}
.av.me{cursor:pointer}
.av.following{outline:2px solid #fff;outline-offset:1px}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--accent);background:#152452}
button.pri{background:linear-gradient(180deg,#1b3d7a,#14306a);border-color:#2d5bb0}
button.danger:hover{border-color:var(--danger);color:#ffb3bb}
button:disabled{opacity:.4;cursor:default}
main{display:grid;grid-template-columns:52px 176px 1fr 300px;height:calc(100vh - 50px)}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;overflow-y:auto}
#tools button{width:38px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-color:transparent;background:transparent;border-radius:8px;flex:none}
#tools button:hover{background:#152452}
#tools button.on{background:#1b3d7a;border-color:#2d5bb0;box-shadow:0 0 10px rgba(95,211,255,.25)}
#tools svg{width:20px;height:20px}
#tools .div{width:28px;height:1px;background:var(--line);margin:4px 0;flex:none}
#slidesPane{background:#0a1229;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#slidesPane h2{padding:10px 10px 0}
#slideList{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:8px}
.sl{position:relative;border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;background:var(--panel)}
.sl:hover{border-color:#2d5bb0}
.sl.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px rgba(95,211,255,.2)}
.sl svg{width:100%;aspect-ratio:1;display:block;border-radius:5px;pointer-events:none}
.sl .cap{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:11.5px}
.sl .num{color:var(--dim);font-weight:600}
.sl .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .more{padding:0 6px;font-size:14px;line-height:18px;background:transparent;border-color:transparent}
.sl .dots{position:absolute;top:9px;right:9px;display:flex;gap:2px}
.sl .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #0b1430}
.slActs{padding:8px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.menu{position:fixed;z-index:40;background:var(--panel);border:1px solid #2d5bb0;border-radius:9px;padding:4px;min-width:170px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px}
.menu button:hover{background:#16295a}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
aside.right{background:var(--panel);overflow-y:auto;padding:12px;border-left:1px solid var(--line)}
h2{font:600 13px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:4px 0 8px}
.stagewrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0e1a3d 0,#070d1f 70%)}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;display:block}
#stage .it{cursor:move}
#stage.t-pen,#stage.t-pen .it,#stage.t-arrowd,#stage.t-arrowd .it,#stage.t-stamp,#stage.t-stamp .it{cursor:crosshair}
#stage.t-text,#stage.t-text .it{cursor:text}
#stage.t-tether,#stage.t-pick{cursor:crosshair}
#stage.t-tether .it,#stage.t-pick .it{cursor:pointer}
#stage.t-eraser,#stage.t-eraser .it{cursor:cell}
#stage.t-hand,#stage.t-hand .it,#stage.panning,#stage.panning .it{cursor:grab}
#stage [data-handle]{cursor:grab}
#stage.ro .it{cursor:default}
.readout{position:absolute;left:12px;bottom:10px;font:500 11.5px/1.4 ui-monospace,Menlo,monospace;color:var(--dim);background:rgba(7,13,31,.8);padding:4px 8px;border-radius:6px;border:1px solid var(--line);pointer-events:none}
.zoom{position:absolute;right:12px;bottom:10px;display:flex;gap:4px;align-items:center;background:rgba(7,13,31,.8);border:1px solid var(--line);border-radius:8px;padding:3px}
.zoom button{padding:3px 8px;border-color:transparent;background:transparent}
.zoom span{min-width:44px;text-align:center;font-size:11.5px;color:var(--dim)}
#toolopts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:rgba(13,22,48,.95);border:1px solid #2d5bb0;border-radius:10px;padding:6px 10px;box-shadow:0 6px 24px rgba(0,0,0,.4);white-space:nowrap}
#toolopts.on{display:flex}
#toolopts label{color:var(--dim);font-size:11.5px}
#toolopts input[type=range]{width:90px}
#toolopts .swatches{margin:0}
.banner{position:absolute;top:10px;left:12px;background:rgba(40,30,0,.85);border:1px solid #806a10;color:#ffe08a;padding:6px 10px;border-radius:8px;font-size:12px;max-width:340px;display:none}
.banner.on{display:block}
.row{display:grid;grid-template-columns:90px 1fr 62px;align-items:center;gap:7px;margin:6px 0}
.row.two{grid-template-columns:90px 1fr}
.row label{color:var(--dim);font-size:12px}
input[type=number],input[type=text],select,textarea{width:100%;background:#091129;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit}
input[type=number]{padding:4px 5px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:28px;border:1px solid var(--line);border-radius:6px;background:#091129;padding:2px}
.chk{display:flex;align-items:center;gap:7px;color:var(--text);font-size:12px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.chks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}
.swatches{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px 97px}
.swatches button{width:20px;height:20px;padding:0;border-radius:5px;border:1px solid rgba(255,255,255,.25)}
.swatches button.on{outline:2px solid #fff;outline-offset:1px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sect{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.note{color:var(--dim);font-size:11.5px;margin:4px 0}
#layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#layers li{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer}
#layers li:hover{background:#13214a}
#layers .sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.3)}
#layers .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#layers .ty{color:var(--dim);font-size:11px}
#layers .ib{padding:1px 5px;font-size:11px;border-radius:4px;background:transparent;border-color:transparent;color:var(--dim)}
#layers .ib.act{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(3,6,16,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid #2d5bb0;border-radius:12px;padding:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 0 40px rgba(95,211,255,.15)}
.modal img{max-width:100%;max-height:58vh;display:block;margin:10px auto;border-radius:6px;border:1px solid var(--line)}
.modal textarea{height:260px;font:12px ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#16295a;border:1px solid #2d5bb0;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
#textEd{position:absolute;display:none;background:rgba(9,17,41,.92);border:1px solid var(--accent);color:#fff;font-weight:600;font-family:Inter,sans-serif;text-align:center;padding:2px 4px;resize:none;overflow:hidden;z-index:5;line-height:1.2;border-radius:4px}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim)}
.empty.on{display:flex}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px}
@media (max-width:1000px){
  main{grid-template-columns:48px 1fr;grid-template-rows:62vh auto auto;height:auto}
  html,body{overflow:auto}
  #tools{grid-row:1}
  .stagewrap{grid-column:2;grid-row:1}
  #slidesPane{grid-column:1/3;grid-row:2;max-height:none}
  #slideList{flex-direction:row;overflow-x:auto}
  .sl{width:120px;flex:none}
  aside.right{grid-column:1/3;grid-row:3;border-left:0}
  header{overflow-x:auto}
}
</style>
</head>
<body>
<header>
  <h1>FFXIV <span>Mechanics</span> Board</h1>
  <span class="status" id="status"><span class="dot"></span>Connecting…</span>
  <div class="sp"></div>
  <div id="avatars"></div>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <button id="jsonBtn">Save / Load</button>
  <button id="pngBtn" class="pri">Export</button>
</header>
<main>
  <div id="tools"></div>
  <div id="slidesPane">
    <h2>Slides</h2>
    <div id="slideList"></div>
    <div class="slActs">
      <button id="addSlide" class="pri">+ New slide</button>
      <button id="pasteSlide" disabled>Paste copied slide</button>
    </div>
  </div>
  <div class="stagewrap" id="wrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    <textarea id="textEd" rows="1" spellcheck="false"></textarea>
    <div id="toolopts"></div>
    <div class="banner" id="banner"></div>
    <div class="readout" id="readout">—</div>
    <div class="zoom"><button id="zOut" title="Zoom out">−</button><span id="zPct">100%</span><button id="zIn" title="Zoom in">+</button><button id="zFit" title="Fit arena">Fit</button></div>
    <div class="empty" id="empty"><div>This board has no slides yet.</div><button class="pri" id="emptyAdd">Create the first slide</button></div>
    <div id="loading">Loading board…</div>
  </div>
  <aside class="right" id="insp"></aside>
</main>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

function fromPolar(d,a){const A=arenaOf(curSlideDoc()),t=a*Math.PI/180;return{x:r2(A.cx+d*Math.sin(t)),y:r2(A.cy-d*Math.cos(t))};}
const normRot=a=>r2(((a+180)%360+360)%360-180);
function snap(v){const st=arenaOf(curSlideDoc()).snap;return st>0?r2(Math.round(v/st)*st):r2(v);}
const selItems=()=>selIds.map(id=>getDoc('items',id)).filter(Boolean);
function setSel(ids){selIds=ids;sendPresence({sel:ids.slice(0,40)});buildInsp();scheduleRender();}

function deleteSel(){const its=selItems();if(!its.length)return;const gone=new Set(its.map(i=>i.id));its.forEach(it=>edit('items',it.id,null));
  slideItems(curSlide).forEach(t=>{if(t.type==='tether'&&!gone.has(t.id)&&(gone.has(t.a)||gone.has(t.b)))edit('items',t.id,null);});setSel([]);toast('Deleted — Ctrl+Z to undo');}
function remapRefs(list,map,valid){return list.map(it=>{const n={...clone(it)};for(const f of['target','a','b']){if(!n[f])continue;if(map[n[f]])n[f]=map[n[f]];else if(!valid(n[f]))n[f]='';}return n;}).filter(n=>n.type!=='tether'||(n.a&&n.b));}
function duplicateSel(){const its=selItems();if(!its.length)return;let z=newZ();const ids=[],map={};its.forEach(it=>map[it.id]=uid());
  for(const it of remapRefs(its,map,id=>!!getDoc('items',id))){const id=map[it.id];ids.push(id);edit('items',id,{...it,id,x:r2(it.x+1),y:r2(it.y+1),z:z++});}setSel(ids);}
function copySel(){const its=selItems();if(!its.length)return;writeClip('items',clone(its));toast(`Copied ${its.length} item${its.length>1?'s':''}`);}
function pasteItems(){const its=readClip('items');if(!its||!its.length||!curSlide)return;let z=newZ();const ids=[],map={};const same=its[0].slide===curSlide;its.forEach(it=>map[it.id]=uid());
  for(const it of remapRefs(its,map,id=>{const d=getDoc('items',id);return!!(d&&d.slide===curSlide);})){const id=map[it.id];ids.push(id);edit('items',id,{...it,id,slide:curSlide,z:z++,x:r2(it.x+(same?1:0)),y:r2(it.y+(same?1:0))});}setSel(ids);}
function reorder(dir){
  const its=slideItems(curSlide);const s=selItems()[0];if(!s)return;const i=its.findIndex(x=>x.id===s.id),j=dir==='top'?its.length-1:dir==='bottom'?0:i+dir;
  if(j<0||j>=its.length||j===i)return;its.splice(i,1);its.splice(j,0,s);its.forEach((it,n)=>{if((it.z||0)!==n+1)edit('items',it.id,{...clone(it),z:n+1});});
}
function faceToward(s,out){const A=arenaOf(curSlideDoc()),dx=A.cx-s.x,dy=A.cy-s.y;if(Math.hypot(dx,dy)<1e-9)return;patchItem(s.id,{rot:normRot(Math.atan2(dx,-dy)*180/Math.PI+(out?180:0))});}

// ================= inspector =================
function numRow(k,l,step,min,max,attr='data-k'){return `<div class="row"><label>${l}</label><input type="range" ${attr}="${k}" step="${step}" min="${min}" max="${max}"><input type="number" ${attr}="${k}" step="${step}"></div>`;}
function selRow(k,l,opts,attr='data-k'){return `<div class="row two"><label>${l}</label><select ${attr}="${k}">${opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`;}
function txtRow(k,l,attr='data-k'){return `<div class="row two"><label>${l}</label><input type="text" ${attr}="${k}"></div>`;}
function areaRow(k,l,attr='data-k'){return `<div class="row two"><label>${l}</label><textarea rows="2" ${attr}="${k}"></textarea></div>`;}
function refOpts(selfId){const its=slideItems(curSlide).filter(i=>i.id!==selfId&&i.type!=='tether'&&i.type!=='ink');
  const lab=i=>(i.type==='marker'?(i.text||'Player')+' ('+(i.role||'')+')':(i.name||TYPE_LABEL[i.type]));
  its.sort((a,b)=>(a.type==='marker'?0:1)-(b.type==='marker'?0:1));
  return [['','— none —'],...its.map(i=>[i.id,lab(i)])];}
function refRow(k,l,selfId){return `<div class="row two"><label>${l}</label><div style="display:flex;gap:5px"><select data-k="${k}" style="flex:1;min-width:0">${refOpts(selfId).map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select><button data-pick="${k}" title="Click an item on the arena">Pick</button></div></div>`;}
function colRow(k,l,attr='data-k'){return `<div class="row two"><label>${l}</label><input type="color" ${attr}="${k}"></div>`;}
function chk(k,l,attr='data-k'){return `<label class="chk"><input type="checkbox" ${attr}="${k}">${l}</label>`;}
let inspKey='';

  const insp=$('insp'),sl=curSlideDoc();
  const its=selItems();inspKey=curSlide+'|'+selIds.join(',')+'|'+(its[0]?its[0].type:'')+'|'+canWrite+'|'+(its.length===1?slideItems(curSlide).length+(its[0].target||'')+(its[0].attach?1:0):'');
  if(!sl){insp.innerHTML='<p class="note">No slide selected.</p>';return;}
  const A=arenaOf(sl),span=A.radius+A.margin+10,dis=canWrite?'':' disabled';
  if(!its.length){
    const items=slideItems(curSlide);
    insp.innerHTML=`<fieldset style="border:0;padding:0;margin:0"${dis}><h2>Slide</h2>${txtRow('title','Slide title','data-st')}
      <div class="chks">${chk('showTitle','Show title on arena','data-a')}</div>
      <div class="btnrow"><button data-act="waymarks">+ 8 waymarks</button><button data-act="party">+ Party clock spots</button></div>
      <div class="sect"><h2>Arena</h2>
      ${selRow('shape','Shape',[['circle','Circle'],['square','Square']],'data-a')}
      ${numRow('radius','Radius (y)',.5,5,50,'data-a')}${numRow('cx','Center X',.5,0,200,'data-a')}${numRow('cy','Center Y',.5,0,200,'data-a')}
      ${numRow('margin','Margin (y)',.5,1,15,'data-a')}${numRow('snap','Snap (y)',.25,0,5,'data-a')}
      <p class="note">Game coordinates: center (100, 100), +X east, +Y south. 0° = North, clockwise. Snap 0 = free.</p></div>
      <div class="sect"><h2>Guides</h2><div class="chks">${chk('grid','Grid','data-a')}${chk('rings','5y rings','data-a')}${chk('spokes','8-way spokes','data-a')}${chk('cardinals','N/E/S/W','data-a')}${chk('clip','Clip AoEs to arena','data-a')}</div>
      ${numRow('gridStep','Grid step (y)',.5,.5,10,'data-a')}</div>
      <div class="sect"><h2>Colors</h2>${colRow('bg','Background','data-a')}${colRow('floor','Floor center','data-a')}${colRow('floor2','Floor edge','data-a')}${colRow('edge','Arena edge','data-a')}
      <div class="btnrow"><button data-act="resetArena">Reset arena look</button></div></div></fieldset>
      <div class="sect"><h2>Layers <span style="color:var(--dim);letter-spacing:0;font:500 11px Inter">(top = in front)</span></h2><ul id="layers">${
        items.length?[...items].reverse().map(s=>{const c=s.type==='marker'?ROLE_COL[s.role]:s.type==='waymark'?WM_COL[s.mark]:s.color;
          return `<li data-lsel="${s.id}"><span class="sw" style="background:${c}"></span><span class="nm">${esc(s.name||TYPE_LABEL[s.type])}</span><span class="ty">${s.type}</span>${canWrite?`<button class="ib ${s.visible!==false?'act':''}" data-vis="${s.id}" title="Show/hide">${s.visible!==false?'●':'○'}</button><button class="ib ${s.locked?'act':''}" data-lock="${s.id}" title="Lock (ignore clicks on canvas)">${s.locked?'🔒':'🔓'}</button>`:''}</li>`;}).join('')
        :'<li class="note" style="cursor:default">Nothing on this slide yet — pick a tool on the left.</li>'}</ul></div>`;
  } else if(its.length>1){
    insp.innerHTML=`<fieldset style="border:0;padding:0;margin:0"${dis}><h2>${its.length} items selected</h2>
      <div class="row two"><label>Color</label><input type="color" data-multi="color" value="${its[0].color||'#ffffff'}"></div>
      <div class="swatches">${SWATCHES.map(c=>`<button data-sw="${c}" style="background:${c}"></button>`).join('')}</div>
      <div class="row"><label>Opacity</label><input type="range" data-multi="opacity" min="0" max="1" step=".05" value="${its[0].opacity??1}"><span></span></div>
      <div class="btnrow"><button data-act="dup">Duplicate</button><button data-act="copy">Copy</button><button data-act="del" class="danger">Delete</button><button data-act="deselect">Done</button></div>
      <p class="note">Layers: AoEs draw under waymarks, which draw under players, arrows, pen and text. Drag any selected item to move them together. Shift-click to add or remove items.</p></fieldset>`;
  } else {
    const s=its[0];
    const aimed=!!(s.target&&!s.attach&&ROTATABLE.has(s.type)&&getDoc('items',s.target));
    const f=(FIELDS[s.type]||[]).map(x=>x.t==='ref'?refRow(x.k,x.l,s.id):(x.k==='rot'&&aimed)?'':x.t==='num'?numRow(x.k,x.l,x.step,x.min,x.max):x.t==='sel'?selRow(x.k,x.l,x.opts):x.t==='area'?areaRow(x.k,x.l):x.t==='chk'?`<div class="chks">${chk(x.k,x.l)}</div>`:txtRow(x.k,x.l)).join('');
    const aoe=AOE.has(s.type),hasColor=!['marker','waymark'].includes(s.type);
    insp.innerHTML=`<fieldset style="border:0;padding:0;margin:0"${dis}><h2>${TYPE_LABEL[s.type]}</h2>${txtRow('name','Name')}
      ${!['ink','tether'].includes(s.type)?numRow('x','X',.1,r2(A.cx-span),r2(A.cx+span))+numRow('y','Y',.1,r2(A.cy-span),r2(A.cy+span))+numRow('pd','Dist. from ctr',.1,0,A.radius+A.margin)+numRow('pa','Angle from ctr °',1,0,360):''}
      ${!['ink','tether'].includes(s.type)?`<div class="btnrow" style="margin-top:2px"><button data-act="center">Move to center</button>${ROTATABLE.has(s.type)&&!aimed?'<button data-act="faceIn">Face center</button><button data-act="faceOut">Face outward</button>':''}</div>`:''}
      <div class="sect">${f}</div>
      ${TARGETABLE.has(s.type)?`<div class="sect"><h2>Target</h2>${refRow('target','Target',s.id)}
        ${s.target?`<div class="chks">${chk('attach','Stick to target’s position')}</div>`:''}
        ${aimed?numRow('aimOffset','Aim offset °',1,-180,180)+'<p class="note">Rotation follows the target automatically — move the target and this shape re-aims.</p>':s.target&&s.attach?'<p class="note">This shape follows its target around.</p>':`<p class="note">${ROTATABLE.has(s.type)?'Pick a player and this shape will always aim at them.':'Pick a player and tick “stick” to make this shape follow them.'}</p>`}</div>`:''}
      <div class="sect">${hasColor?colRow('color','Color')+`<div class="swatches">${SWATCHES.map(c=>`<button data-sw="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>`:''}
        ${numRow('opacity','Opacity',.05,0,1)}${aoe||s.type==='tether'?txtRow('label','Label')+numRow('labelSize','Label size',.1,.3,6):''}
        <div class="chks">${aoe&&!['tower','boss'].includes(s.type)?chk('stroke','Outline'):''}${chk('visible','Visible')}${chk('locked','Locked')}</div></div>
      <div class="sect btnrow"><button data-act="top" title="Bring to front">⤒ Front</button><button data-act="up">▲</button><button data-act="down">▼</button><button data-act="bottom" title="Send to back">⤓ Back</button>
        <button data-act="dup">Duplicate</button><button data-act="copy">Copy</button><button data-act="del" class="danger">Delete</button><button data-act="deselect">Done</button></div></fieldset>`;
  }
  syncInsp(null,true);
}
function syncInsp(except,force){
  const insp=$('insp');
  const its=selItems();const key=curSlide+'|'+selIds.join(',')+'|'+(its[0]?its[0].type:'')+'|'+canWrite+'|'+(its.length===1?slideItems(curSlide).length+(its[0].target||'')+(its[0].attach?1:0):'');
  if(key!==inspKey&&!force){buildInsp();return;}
  const s=its.length===1?its[0]:null,sl=curSlideDoc(),A=arenaOf(sl),act=document.activeElement;
  insp.querySelectorAll('[data-k],[data-a],[data-st]').forEach(el=>{
    if(el===except||(el===act&&!force))return;let v;
    if(el.dataset.st)v=sl&&sl[el.dataset.st];
    else if(el.dataset.a)v=A[el.dataset.a];
    else{if(!s)return;const k=el.dataset.k;if(k==='pd'||k==='pa'){const p=polar(s);v=k==='pd'?p.d:p.a;}else v=s[k];if(k==='stroke'&&v===undefined)v=true;if(k==='visible'&&v===undefined)v=true;}
    if(el.type==='checkbox')el.checked=!!v;else{const nv=typeof v==='number'?String(+v.toFixed(2)):(v??'');if(el.value!==nv)el.value=nv;}
  });
}
function readVal(el){if(el.type==='checkbox')return el.checked;if(el.type==='number'||el.type==='range'){const v=parseFloat(el.value);return isNaN(v)?null:v;}return el.value;}
const insp=$('insp');
insp.addEventListener('input',e=>{
  const el=e.target,v=readVal(el);if(v===null)return;beginGesture();
  if(el.dataset.multi){selItems().forEach(it=>patchItem(it.id,{[el.dataset.multi]:v}));return;}
  const sl=curSlideDoc();if(!sl)return;
  if(el.dataset.st){edit('slides',sl.id,{...clone(sl),[el.dataset.st]:v});scheduleThumbs();return;}
  if(el.dataset.a){edit('slides',sl.id,{...clone(sl),arena:{...arenaOf(sl),[el.dataset.a]:v}});syncInsp(el);return;}
  const k=el.dataset.k,s=selItems()[0];if(!k||!s)return;
  let patch={[k]:v};
  if(k==='pd'||k==='pa'){const p=polar(s);patch=fromPolar(k==='pd'?v:p.d,k==='pa'?v:p.a);}
  if(k==='mark'&&/^Waymark/.test(s.name||''))patch.name='Waymark '+v;
  if(k==='target'&&!v)patch.attach=false;
  if(k==='target'&&v&&!ROTATABLE.has(s.type))patch.attach=true;
  if(k==='role'&&s.type==='marker'){}
  patchItem(s.id,patch);syncInsp(el);
});
insp.addEventListener('change',e=>{endGesture();if(e.target.dataset.a==='shape'||e.target.dataset.a==='radius'||e.target.dataset.a==='margin')buildInsp();if(e.target.dataset.k==='name'||e.target.dataset.k==='visible'||e.target.dataset.k==='locked')buildInsp();});
insp.addEventListener('focusout',()=>endGesture());
insp.addEventListener('click',e=>{
  const sw=e.target.closest('[data-sw]');if(sw){selItems().forEach(it=>patchItem(it.id,{color:sw.dataset.sw}));return;}
  const v=e.target.closest('[data-vis]');if(v){const it=getDoc('items',v.dataset.vis);if(it)patchItem(it.id,{visible:it.visible===false});setTimeout(buildInsp);return;}
  const l=e.target.closest('[data-lock]');if(l){const it=getDoc('items',l.dataset.lock);if(it)patchItem(it.id,{locked:!it.locked});setTimeout(buildInsp);return;}
  const li=e.target.closest('[data-lsel]');if(li){setSel([li.dataset.lsel]);return;}
  const pk=e.target.closest('[data-pick]');if(pk&&selIds.length===1){picking={id:selIds[0],field:pk.dataset.pick};renderTools();toast('Click a player or item on the arena (Esc to cancel)');return;}
  const b=e.target.closest('[data-act]');if(b)action(b.dataset.act);
});
function action(a){
  const sl=curSlideDoc();const s=selItems()[0];
  switch(a){
    case'resetArena':if(sl)edit('slides',sl.id,{...clone(sl),arena:{...arenaOf(sl),bg:DEFAULT_ARENA.bg,floor:DEFAULT_ARENA.floor,floor2:DEFAULT_ARENA.floor2,edge:DEFAULT_ARENA.edge}});return;
    case'waymarks':{const A=arenaOf(sl),d=Math.max(2,A.radius-5);slideItems(curSlide).filter(i=>i.type==='waymark').forEach(i=>edit('items',i.id,null));let z=newZ();
      [['A',0],['1',45],['B',90],['2',135],['C',180],['3',225],['D',270],['4',315]].forEach(([m,an])=>{const it=make('waymark',{mark:m,name:'Waymark '+m,...fromPolar(d,an),z:z++});edit('items',it.id,it);});return;}
    case'party':{const A=arenaOf(sl),d=Math.min(8,A.radius*.4);let z=newZ();
      [['tank','MT',0],['tank','OT',90],['healer','H1',270],['healer','H2',180],['dps','M1',225],['dps','M2',135],['dps','R1',315],['dps','R2',45]].forEach(([role,t,an])=>{const it=make('marker',{role,text:t,name:t,...fromPolar(d,an),z:z++});edit('items',it.id,it);});return;}
    case'deselect':setSel([]);return;
    case'dup':duplicateSel();return;
    case'copy':copySel();return;
    case'del':deleteSel();return;
  }
  if(!s)return;
  switch(a){
    case'center':{const A=arenaOf(sl);patchItem(s.id,{x:A.cx,y:A.cy});break;}
    case'faceIn':faceToward(s,false);break;case'faceOut':faceToward(s,true);break;
    case'up':reorder(1);break;case'down':reorder(-1);break;case'top':reorder('top');break;case'bottom':reorder('bottom');break;
  }
}

// ================= canvas interaction =================
const svg=$('stage');
function toWorld(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0};}
function itemAt(e){const g=e.target.closest&&e.target.closest('[data-id]');return g?getDoc('items',g.dataset.id):null;}
svg.addEventListener('pointerdown',e=>{
  if(!curSlide)return;closeMenu();
  const pt=toWorld(e);
  if(textEd.open)closeTextEd(false);
  if(e.button===1||spaceDown||tool==='hand'||(e.button===2)){e.preventDefault();drag={mode:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId);svg.classList.add('panning');stopFollow();return;}
  if(e.button!==0)return;
  if(!canWrite){const it=itemAt(e);setSel(it?[it.id]:[]);if(!it){drag={mode:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId);}return;}
  svg.setPointerCapture(e.pointerId);
  if(picking){const it=itemAt(e);const pk=picking;picking=null;renderTools();
    if(it&&it.id!==pk.id&&it.type!=='tether'&&it.type!=='ink'){patchItem(pk.id,{[pk.field]:it.id});toast('Target set: '+(it.name||TYPE_LABEL[it.type]));setSel([pk.id]);}else toast('Pick cancelled');return;}
  if(tool==='tether'){const it=itemAt(e);
    if(!it||it.type==='tether'||it.type==='ink'){if(tetherStart){tetherStart=null;renderToolOpts();scheduleRender();}else toast('Click a player or item to start the tether');return;}
    if(!tetherStart){tetherStart={id:it.id,slide:curSlide,cur:{x:it.x,y:it.y}};renderToolOpts();scheduleRender();return;}
    if(it.id!==tetherStart.id){const st=toolStyle.tether;const a=getDoc('items',tetherStart.id);
      addItem(make('tether',{a:tetherStart.id,b:it.id,color:st.color,width:st.width,opacity:st.opacity,name:'Tether '+((a&&(a.text||a.name))||'')+' – '+(it.text||it.name||'')}),false);}
    tetherStart=null;renderToolOpts();scheduleRender();return;}
  if(tool==='pen'){const o=[r2(pt.x),r2(pt.y)];preview={kind:'ink',o,pts:[[0,0]]};drag={mode:'pen'};scheduleRender();return;}
  if(tool==='eraser'){beginGesture();drag={mode:'erase'};eraseAt(e);return;}
  if(tool==='arrowd'){preview={kind:'arrow',x:snap(pt.x),y:snap(pt.y),rot:0,length:0};drag={mode:'arrow'};return;}
  if(tool==='text'){const it=make('text',{x:snap(pt.x),y:snap(pt.y),text:'',color:toolStyle.text.color,size:toolStyle.text.size,name:'Text'});drag=null;openTextEd(it,true);return;}
  if(DEF[tool]){const extra={x:snap(pt.x),y:snap(pt.y)};const it=make(tool,extra);if(tool==='marker'){}addItem(it);setTool('select');drag=null;return;}
  // select tool
  if(e.target.closest('[data-handle]')&&selIds.length===1){const it=getDoc('items',selIds[0]);beginGesture();touch('items',it.id);drag={mode:'rot',id:it.id,moved:false};return;}
  const it=itemAt(e);
  if(it){
    if(e.shiftKey){setSel(selIds.includes(it.id)?selIds.filter(x=>x!==it.id):[...selIds,it.id]);drag=null;return;}
    if(!selIds.includes(it.id))setSel([it.id]);
    const start={};selItems().forEach(s=>{if(!s.locked&&s.type!=='tether'&&!(s.target&&s.attach&&getDoc('items',s.target)))start[s.id]=[s.x,s.y];});
    beginGesture();Object.keys(start).forEach(id=>touch('items',id));
    drag={mode:'move',px:pt.x,py:pt.y,start,ax:it.x,ay:it.y,moved:false};
  } else {
    if(!e.shiftKey&&selIds.length)setSel([]);
    preview={kind:'box',x0:pt.x,y0:pt.y,x1:pt.x,y1:pt.y};drag={mode:'box',add:e.shiftKey};
  }
});
function eraseAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);const g=el&&el.closest&&el.closest('[data-id]');
  if(g){const it=getDoc('items',g.dataset.id);if(it&&it.type==='ink'&&!it.locked)edit('items',it.id,null);}
}
svg.addEventListener('pointermove',e=>{
  const pt=toWorld(e),p=polar(pt);
  $('readout').textContent=`X ${pt.x.toFixed(1)}  Y ${pt.y.toFixed(1)}  ·  ${p.d.toFixed(1)}y @ ${p.a.toFixed(0)}°`;
  sendPresence({cursor:{x:r2(pt.x),y:r2(pt.y)}});
  if(tetherStart){tetherStart.cur={x:pt.x,y:pt.y};scheduleRender();}
  if(!drag)return;
  if(drag.mode==='pan'){const m=svg.getScreenCTM();if(!m)return;view.x=drag.vx-(e.clientX-drag.sx)/m.a;view.y=drag.vy-(e.clientY-drag.sy)/m.d;sendView();scheduleRender();return;}

  const P=(d,a)=>({x:r2(100+d*Math.sin(a*Math.PI/180)),y:r2(100-d*Math.cos(a*Math.PI/180))});
  [['A',0],['1',45],['B',90],['2',135],['C',180],['3',225],['D',270],['4',315]].forEach(([m,a])=>put('waymark',{mark:m,name:'Waymark '+m,...P(15,a)}));
  put('cone',{name:'Frontal cleave',rot:180});put('boss',{});
}
init();
</script>
