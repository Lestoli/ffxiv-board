<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFXIV Mechanics Diagrammer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d1f;--panel:#0d1630;--panel2:#111d3d;--line:#1f2f5c;--text:#dbe6ff;--dim:#7f92bf;--accent:#5fd3ff;--danger:#ff5a6a;--ok:#4dff88}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 Inter,system-ui,sans-serif;overflow:hidden}
header{height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0b1430,#0a1028)}
header h1{font:700 19px Rajdhani,sans-serif;letter-spacing:.06em;margin:0 6px 0 0;color:#fff;text-shadow:0 0 12px rgba(95,211,255,.55);white-space:nowrap}
header h1 span{color:var(--accent)}
.sp{flex:1}
.status{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 10px;white-space:nowrap}
.status b{font-weight:600}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--dim);vertical-align:1px}
.status.live .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.status.ro .dot{background:#ffd43b}
#avatars{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11px Inter;color:#fff;border:2px solid #0b1430;margin-left:-6px;cursor:pointer;position:relative}
.av.me{cursor:pointer}
.av.following{outline:2px solid #fff;outline-offset:1px}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--accent);background:#152452}
button.pri{background:linear-gradient(180deg,#1b3d7a,#14306a);border-color:#2d5bb0}
button.danger:hover{border-color:var(--danger);color:#ffb3bb}
button:disabled{opacity:.4;cursor:default}
main{display:grid;grid-template-columns:52px auto 1fr auto;height:calc(100vh - 50px)}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;overflow-y:auto}
#tools button{width:38px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-color:transparent;background:transparent;border-radius:8px;flex:none}
#tools button:hover{background:#152452}
#tools button.on{background:#1b3d7a;border-color:#2d5bb0;box-shadow:0 0 10px rgba(95,211,255,.25)}
#tools svg{width:20px;height:20px}
#tools .div{width:28px;height:1px;background:var(--line);margin:4px 0;flex:none}
#leftCols{display:flex;min-height:0}
#slidesPane,#pullsPane{width:176px;background:#0a1229;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#pullsPane{width:186px;background:#0c1124}
#leftCols.nopulls #pullsPane{display:none}
.colHead{padding:10px 10px 0;display:flex;align-items:center;gap:6px}
.colHead .sp{flex:1}
.colHead button{padding:1px 7px;font:500 11px Inter;letter-spacing:0;text-transform:none}
.pullsH{color:#ffb36b}
#showPulls{display:none}
#leftCols.nopulls #showPulls{display:inline-block}
#pullList{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:8px}
#pullList .secHead{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font:600 12px Rajdhani,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ffb36b}
#pullList .secHead .sp{flex:1}
#pullList .secHead button{white-space:nowrap;padding:2px 7px;font:500 11px Inter;letter-spacing:0;text-transform:none}
#pullList .secOpts{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--dim)}
#pullList .secOpts input[type=number]{width:52px;padding:2px 4px}
.sl.pull{border-color:#5a3a1c}.sl.pull.on{border-color:#ffb36b;box-shadow:0 0 0 1px #ffb36b,0 0 14px rgba(255,179,107,.25)}
.sl.pull .num{color:#ffb36b}
.live{display:inline-block;font:700 9.5px Inter;color:#0a1028;background:#ff5a6a;border-radius:4px;padding:1px 4px;margin-left:4px;letter-spacing:.04em}
.evinfo{display:grid;grid-template-columns:84px 1fr;gap:3px 8px;font-size:12px;margin:4px 0}
.evinfo b{color:var(--dim);font-weight:500}
.dbadge{flex:none;display:inline-block;font:700 9.5px Inter;border-radius:4px;padding:1px 5px;margin-left:5px;letter-spacing:.03em;vertical-align:1px;white-space:nowrap}
.dbadge.near{background:#ffd43b;color:#1a1200}.dbadge.far{background:#c77dff;color:#16052a}
#layers li.dist-near{box-shadow:inset 3px 0 0 #ffd43b}#layers li.dist-far{box-shadow:inset 3px 0 0 #c77dff}
.flipbtn{padding:1px 7px;font:500 11px Inter;letter-spacing:0;text-transform:none;margin-left:6px}
#slideList{flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:8px}
.sl{content-visibility:auto;contain-intrinsic-size:auto 190px;position:relative;border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;background:var(--panel)}
.sl:hover{border-color:#2d5bb0}
.sl.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px rgba(95,211,255,.2)}
.sl svg{width:100%;aspect-ratio:1;display:block;border-radius:5px;pointer-events:none}
.sl .cap{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:11.5px}
.sl .num{color:var(--dim);font-weight:600}
.sl .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .more{padding:0 6px;font-size:14px;line-height:18px;background:transparent;border-color:transparent}
.sl .dots{position:absolute;top:9px;right:9px;display:flex;gap:2px}
.sl .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #0b1430}
.slActs{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.menu{position:fixed;z-index:40;background:var(--panel);border:1px solid #2d5bb0;border-radius:9px;padding:4px;min-width:170px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px}
.menu button:hover{background:#16295a}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
aside.right{background:var(--panel);display:flex;padding:0;overflow:visible;position:relative;border-left:1px solid var(--line);min-height:0;z-index:4}
#slidePane{width:300px;overflow-y:auto;padding:12px;flex:none}
#itemPane{width:290px;overflow-y:auto;padding:12px;display:none;position:absolute;top:0;bottom:0;right:100%;background:rgba(15,26,58,.97);border-right:1px solid #2d5bb0;border-left:1px solid #2d5bb0;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
#insp.item #itemPane{display:block;animation:paneIn .14s ease-out}
@keyframes paneIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
#itemPane .closeItem{position:absolute;top:8px;right:8px;padding:2px 8px;font-size:13px;line-height:18px;background:transparent}
#layers li.on{background:#16295a;outline:1px solid #2d5bb0}
h2{font:600 13px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:4px 0 8px}
.stagewrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0e1a3d 0,#070d1f 70%)}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;display:block}
#stage .it{cursor:move}
#stage.t-pen,#stage.t-pen .it,#stage.t-arrowd,#stage.t-arrowd .it,#stage.t-stamp,#stage.t-stamp .it{cursor:crosshair}
#stage.t-text,#stage.t-text .it{cursor:text}
#stage.t-tether,#stage.t-pick{cursor:crosshair}
#stage.t-tether .it,#stage.t-pick .it{cursor:pointer}
#stage.t-eraser,#stage.t-eraser .it{cursor:cell}
#stage.t-hand,#stage.t-hand .it,#stage.panning,#stage.panning .it{cursor:grab}
#stage [data-handle]{cursor:grab}
#stage.ro .it{cursor:default}
.readout{position:absolute;left:12px;bottom:10px;font:500 11.5px/1.4 ui-monospace,Menlo,monospace;color:var(--dim);background:rgba(7,13,31,.8);padding:4px 8px;border-radius:6px;border:1px solid var(--line);pointer-events:none}
.tl{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:min(620px,calc(100% - 40px));min-width:300px;display:none;align-items:center;gap:6px;background:rgba(13,22,48,.95);border:1px solid #2d5bb0;border-radius:10px;padding:5px 8px;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:3}
.tl.on{display:flex}
.tl button{padding:3px 8px;min-width:30px}
.tl input[type=range]{flex:1;min-width:80px}
.tl .tt{font:600 12px ui-monospace,Menlo,monospace;color:#fff;min-width:70px;text-align:center}
.tl select,.tl input[type=number]{width:auto;padding:2px 4px;font-size:11.5px}
.tl label{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:3px;white-space:nowrap}
.dbrow{display:grid;grid-template-columns:1fr 34px 54px 22px;gap:4px;align-items:center;margin:4px 0}
.dbrow.anim{grid-template-columns:1fr 30px 46px 46px 22px}
.kfrow{display:grid;grid-template-columns:54px 1fr 1fr 22px;gap:4px;align-items:center;margin:3px 0}
main:has(#insp.item) .zoom{right:302px}
@media (max-width:1000px){main:has(#insp.item) .zoom{right:12px}}
.zoom{position:absolute;right:12px;bottom:10px;display:flex;gap:4px;align-items:center;background:rgba(7,13,31,.8);border:1px solid var(--line);border-radius:8px;padding:3px}
.zoom button{padding:3px 8px;border-color:transparent;background:transparent}
.zoom span{min-width:44px;text-align:center;font-size:11.5px;color:var(--dim)}
#toolopts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:rgba(13,22,48,.95);border:1px solid #2d5bb0;border-radius:10px;padding:6px 10px;box-shadow:0 6px 24px rgba(0,0,0,.4);white-space:nowrap}
#toolopts.on{display:flex}
#toolopts label{color:var(--dim);font-size:11.5px}
#toolopts input[type=range]{width:90px}
#toolopts .swatches{margin:0}
.banner{position:absolute;top:10px;left:12px;background:rgba(40,30,0,.85);border:1px solid #806a10;color:#ffe08a;padding:6px 10px;border-radius:8px;font-size:12px;max-width:340px;display:none}
.banner.on{display:block}
.row{display:grid;grid-template-columns:90px 1fr 62px;align-items:center;gap:7px;margin:6px 0}
.row.two{grid-template-columns:90px 1fr}
.row label{color:var(--dim);font-size:12px}
input[type=number],input[type=text],select,textarea{width:100%;background:#091129;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit}
input[type=number]{padding:4px 5px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:28px;border:1px solid var(--line);border-radius:6px;background:#091129;padding:2px}
.chk{display:flex;align-items:center;gap:7px;color:var(--text);font-size:12px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.chks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}
.swatches{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px 97px}
.swatches button{width:20px;height:20px;padding:0;border-radius:5px;border:1px solid rgba(255,255,255,.25)}
.swatches button.on{outline:2px solid #fff;outline-offset:1px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sect{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.note{color:var(--dim);font-size:11.5px;margin:4px 0}
#layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#layers li{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer}
#layers li:hover{background:#13214a}
#layers .sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.3)}
#layers .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#layers .ty{color:var(--dim);font-size:11px}
#layers .ib{padding:1px 5px;font-size:11px;border-radius:4px;background:transparent;border-color:transparent;color:var(--dim)}
#layers .ib.act{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(3,6,16,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid #2d5bb0;border-radius:12px;padding:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 0 40px rgba(95,211,255,.15)}
.modal img{max-width:100%;max-height:58vh;display:block;margin:10px auto;border-radius:6px;border:1px solid var(--line)}
.modal textarea{height:260px;font:12px ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#16295a;border:1px solid #2d5bb0;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
#textEd{position:absolute;display:none;background:rgba(9,17,41,.92);border:1px solid var(--accent);color:#fff;font-weight:600;font-family:Inter,sans-serif;text-align:center;padding:2px 4px;resize:none;overflow:hidden;z-index:5;line-height:1.2;border-radius:4px}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--dim)}
.empty.on{display:flex}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px}
@media (max-width:1000px){
  main{grid-template-columns:48px 1fr;grid-template-rows:62vh auto auto;height:auto}
  html,body{overflow:auto}
  #tools{grid-row:1}
  .stagewrap{grid-column:2;grid-row:1}
  #leftCols{grid-column:1/3;grid-row:2;flex-direction:column}
  #slidesPane,#pullsPane{width:auto}
  #slideList{flex-direction:row;overflow-x:auto}
  .sl{width:120px;flex:none}
  aside.right{grid-column:1/3;grid-row:3;border-left:0;flex-direction:column}
  #slidePane,#itemPane{width:auto}
  #itemPane{position:static;border:0;box-shadow:none}
  header{overflow-x:auto}
}
</style>
</head>
<body>
<header>
  <h1>FFXIV <span>Mechanics</span> Board</h1><span id="ver" title="App version — refresh the page if a teammate sees a different number" style="font-size:11px;color:var(--dim);margin-right:4px">v21</span>
  <span class="status" id="status"><span class="dot"></span>Connecting…</span>
  <div class="sp"></div>
  <div id="avatars"></div>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <button id="jsonBtn">Save / Load</button>
  <button id="pngBtn" class="pri">Export</button>
</header>
<main>
  <div id="tools"></div>
  <div id="leftCols">
  <div id="slidesPane">
    <h2 class="colHead">Slides<span class="sp"></span><button id="showPulls" title="Show the Pulls column"></button></h2>
    <div id="slideList"></div>
  </div>
  <div id="pullsPane">
    <h2 class="colHead pullsH">Pulls<span class="sp"></span><button id="hidePulls" title="Hide the Pulls column">✕</button></h2>
    <div id="pullList"></div>
  </div>
  </div>
  <div class="stagewrap" id="wrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    <textarea id="textEd" rows="1" spellcheck="false"></textarea>
    <div id="toolopts"></div>
    <div class="banner" id="banner"></div>
    <div class="readout" id="readout">—</div>
    <div class="tl" id="timeline"></div>
    <div class="zoom"><button id="zOut" title="Zoom out">−</button><span id="zPct">100%</span><button id="zIn" title="Zoom in">+</button><button id="zFit" title="Fit arena">Fit</button></div>
    <div class="empty" id="empty"><div>This board has no slides yet.</div><button class="pri" id="emptyAdd">Create the first slide</button></div>
    <div id="loading">Loading board…</div>
  </div>
  <aside class="right" id="insp"><div id="itemPane"></div><div id="slidePane"></div></aside>
</main>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

//  SETUP — paste your Firebase web config here (Firebase console →

// =====================================================================

  projectId: "ffxiv-diagram",
  storageBucket: "ffxiv-diagram.firebasestorage.app",
  messagingSenderId: "315795999535",
  appId: "1:315795999535:web:f2b04f6bd6353e0459afda"
};
// Board everyone lands on. Add #b=some-name to the URL for a separate board.
const DEFAULT_BOARD = "raid";

<script>
// ================= constants =================
const FONT='Inter, Segoe UI, Arial, sans-serif';
const ROLE_COL={tank:'#2f6fe0',healer:'#2e9e4f',dps:'#c8343a',support:'#2a8f9e',other:'#7d7d8a'};
const WM_COL={A:'#ff5a5a',B:'#ffd43b',C:'#4dabff',D:'#c77dff','1':'#ff5a5a','2':'#ffd43b','3':'#4dabff','4':'#c77dff'};
const SWATCHES=['#ff8a2b','#ff3b3b','#ffd43b','#4dff88','#4dabff','#b46bff','#ff5fd2','#ffffff','#202020'];
const PEER_COLS=['#ff6b6b','#ffd43b','#4dff88','#4dabff','#c77dff','#ff9f43','#2ee6d6','#ff5fd2'];
const JOBS=[['PLD','tank','Paladin'],['WAR','tank','Warrior'],['DRK','tank','Dark Knight'],['GNB','tank','Gunbreaker'],
  ['WHM','healer','White Mage'],['SCH','healer','Scholar'],['AST','healer','Astrologian'],['SGE','healer','Sage'],
  ['MNK','dps','Monk'],['DRG','dps','Dragoon'],['NIN','dps','Ninja'],['SAM','dps','Samurai'],['RPR','dps','Reaper'],['VPR','dps','Viper'],
  ['BRD','dps','Bard'],['MCH','dps','Machinist'],['DNC','dps','Dancer'],['BLM','dps','Black Mage'],['SMN','dps','Summoner'],['RDM','dps','Red Mage'],['PCT','dps','Pictomancer'],['BLU','dps','Blue Mage']];
const JOB_ROLE=Object.fromEntries(JOBS.map(j=>[j[0],j[1]]));
const DEBUFF_PRESETS=[['Spread','#b46bff'],['Stack','#ffd43b'],['Tether','#ff5fd2'],['Doom','#7a1f3d'],['Vuln','#ff8a2b'],['Beacon','#4dabff']];
// head markers (original artwork, not game icons)
const HEAD_GROUPS=[['Shapes',[['ps_circle','Circle'],['ps_cross','Cross'],['ps_triangle','Triangle'],['ps_square','Square']]],
  ['Limit cut',[1,2,3,4,5,6,7,8].map(n=>['lc'+n,'Limit cut '+n])],
  ['Attack',[1,2,3,4,5,6,7,8].map(n=>['atk'+n,'Attack '+n])],
  ['Bind',[1,2,3].map(n=>['bind'+n,'Bind '+n])],
  ['Ignore',[1,2].map(n=>['ign'+n,'Ignore '+n])]];
const HEAD_LABEL=Object.fromEntries(HEAD_GROUPS.flatMap(g=>g[1]));
function headGlyph(k,h){ // centred at 0,0, roughly h tall
  const r=h/2,bg=`<circle r="${r}" fill="#0a1028" fill-opacity=".85"/>`,num=k.replace(/\D/g,''),sw=h*.13;
  const tx=(c,fs,y=0)=>`<text y="${y}" font-size="${fs}" font-family="${FONT}" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central" stroke="${c}" stroke-width="${fs*.1}" paint-order="stroke">${num}</text>`;
  if(k==='ps_circle')return bg+`<circle r="${r*.62}" fill="none" stroke="#ff4d6d" stroke-width="${sw}"/>`;
  if(k==='ps_cross')return bg+`<path d="M${-r*.55} ${-r*.55}L${r*.55} ${r*.55}M${r*.55} ${-r*.55}L${-r*.55} ${r*.55}" stroke="#4dabff" stroke-width="${sw}" stroke-linecap="round"/>`;

function make(type,extra={}){const A=arenaOf(curSlideDoc());const timed=isAnimSlide()&&playT>.01&&(AOE.has(type)||type==='text'||type==='ink')?{start:r2(playT)}:{};

function newZ(){const it=slideItems(curSlide);return it.length?(it[it.length-1].z||0)+1:1;}
function addItem(it,select=true){if(!edit('items',it.id,it))return;if(select){selIds=[it.id];sendPresence({sel:selIds});buildInsp();}}
function polar(p){const A=arenaOf(curSlideDoc()),dx=p.x-A.cx,dy=p.y-A.cy;let a=Math.atan2(dx,-dy)*180/Math.PI;if(a<0)a+=360;const d=Math.hypot(dx,dy);return{d,a:d<1e-9?0:a};}
function fromPolar(d,a){const A=arenaOf(curSlideDoc()),t=a*Math.PI/180;return{x:r2(A.cx+d*Math.sin(t)),y:r2(A.cy-d*Math.cos(t))};}
const normRot=a=>r2(((a+180)%360+360)%360-180);
function snap(v){const st=arenaOf(curSlideDoc()).snap;return st>0?r2(Math.round(v/st)*st):r2(v);}
const selItems=()=>selIds.map(id=>getDoc('items',id)).filter(Boolean);

function deleteSel(){const its=selItems();if(!its.length)return;const gone=new Set(its.map(i=>i.id));its.forEach(it=>edit('items',it.id,null));
  slideItems(curSlide).forEach(t=>{if(t.type==='tether'&&!gone.has(t.id)&&(gone.has(t.a)||gone.has(t.b)))edit('items',t.id,null);});setSel([]);toast('Deleted — Ctrl+Z to undo');}
function remapRefs(list,map,valid){return list.map(it=>{const n={...clone(it)};for(const f of['target','a','b']){if(!n[f])continue;if(map[n[f]])n[f]=map[n[f]];else if(!valid(n[f]))n[f]='';}return n;}).filter(n=>n.type!=='tether'||(n.a&&n.b));}
function duplicateSel(){const its=selItems();if(!its.length)return;let z=newZ();const ids=[],map={};its.forEach(it=>map[it.id]=uid());
  for(const it of remapRefs(its,map,id=>!!getDoc('items',id))){const id=map[it.id];ids.push(id);edit('items',id,{...it,id,x:r2(it.x+1),y:r2(it.y+1),z:z++});}setSel(ids);}
function copySel(){const its=selItems();if(!its.length)return;writeClip('items',clone(its));toast(`Copied ${its.length} item${its.length>1?'s':''}`);}
function pasteItems(){const its=readClip('items');if(!its||!its.length||!curSlide)return;let z=newZ();const ids=[],map={};const same=its[0].slide===curSlide;its.forEach(it=>map[it.id]=uid());
  for(const it of remapRefs(its,map,id=>{const d=getDoc('items',id);return!!(d&&d.slide===curSlide);})){const id=map[it.id];ids.push(id);edit('items',id,{...it,id,slide:curSlide,z:z++,x:r2(it.x+(same?1:0)),y:r2(it.y+(same?1:0))});}setSel(ids);}
function reorder(dir){
  const its=slideItems(curSlide);const s=selItems()[0];if(!s)return;const i=its.findIndex(x=>x.id===s.id),j=dir==='top'?its.length-1:dir==='bottom'?0:i+dir;
  if(j<0||j>=its.length||j===i)return;its.splice(i,1);its.splice(j,0,s);its.forEach((it,n)=>{if((it.z||0)!==n+1)edit('items',it.id,{...clone(it),z:n+1});});
}
function faceToward(s,out){const A=arenaOf(curSlideDoc()),dx=A.cx-s.x,dy=A.cy-s.y;if(Math.hypot(dx,dy)<1e-9)return;patchItem(s.id,{rot:normRot(Math.atan2(dx,-dy)*180/Math.PI+(out?180:0))});}

    local.items.set(it.id,{...clone(it),rot:normRot(a)});drag.moved=true;sendPresence({drag:{s:curSlide,m:{[it.id]:[it.x,it.y,normRot(a)]}}});scheduleRender();return;}

function endDrag(e){
  if(!drag)return;const d=drag;drag=null;svg.classList.remove('panning');

    const pts=preview.pts.length>1?preview.pts:[[0,0],[.01,0]];

    addItem(it,false);preview=null;setTimeout(()=>sendPresence({ink:null}),350);
  }
  if(d.mode==='arrow'&&preview){if(preview.length>.5){const it=make('arrow',{x:preview.x,y:preview.y,rot:preview.rot,length:preview.length,width:toolStyle.arrowd.width,color:toolStyle.arrowd.color,opacity:toolStyle.arrowd.opacity,stroke:false});addItem(it,false);}preview=null;}
  if(d.mode==='box'&&preview){const x0=Math.min(preview.x0,preview.x1),x1=Math.max(preview.x0,preview.x1),y0=Math.min(preview.y0,preview.y1),y1=Math.max(preview.y0,preview.y1);

      setSel(d.add?[...new Set([...selIds,...hit])]:hit);}preview=null;}
  if(d.mode==='erase')endGesture();

    if(d.moved){for(const id of(d.mode==='move'?Object.keys(d.start):[d.id])){const v=local.items.get(id);if(v){const w={...v};delete w._dragPos;queueWrite('items',id,w);}}}

}

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=['input','textarea','select'].includes(tag)||e.target.isContentEditable;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if($('modal').classList.contains('on')){if(e.key==='Escape')closeModal();return;}
  if(mod&&k==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'&&!typing){e.preventDefault();redo();return;}
  if(typing)return;
  if(e.code==='Space'){if(!spaceDown){spaceDown=true;svg.classList.add('panning');}e.preventDefault();return;}
  if(mod&&k==='c'){copySel();e.preventDefault();return;}
  if(mod&&k==='v'){if(canWrite)pasteItems();e.preventDefault();return;}
  if(mod&&k==='d'){e.preventDefault();if(canWrite)duplicateSel();return;}
  if(mod&&k==='a'){e.preventDefault();setSel(slideItems(curSlide).filter(i=>!i.locked&&i.visible!==false).map(i=>i.id));return;}
  if(e.key==='PageDown'||e.key==='PageUp'){const s=slidesSorted(),i=s.findIndex(x=>x.id===curSlide),j=i+(e.key==='PageDown'?1:-1);if(s[j])goSlide(s[j].id);e.preventDefault();return;}
  if(k==='k'&&!mod&&isAnimSlide()){setPlaying(!playing);return;}
  if(e.key==='Escape'){if(picking||tetherStart){picking=null;tetherStart=null;renderTools();scheduleRender();return;}if(selIds.length)setSel([]);else setTool('select');return;}
  if(!mod&&TOOLKEYS[k]&&!(k==='e')){setTool(canWrite||['select','hand'].includes(TOOLKEYS[k])?TOOLKEYS[k]:tool);return;}
  if(!canWrite)return;
  const its=selItems();if(!its.length)return;
  const step=(arenaOf(curSlideDoc()).snap||.5)*(e.shiftKey?5:1);
  const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(mv){e.preventDefault();its.forEach(it=>patchItem(it.id,{x:r2(it.x+mv[0]*step),y:r2(it.y+mv[1]*step)}));return;}
  if(k==='q'||k==='e'){its.filter(it=>ROTATABLE.has(it.type)).forEach(it=>patchItem(it.id,{rot:normRot((it.rot||0)+(k==='e'?1:-1)*(e.shiftKey?5:15))}));return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();return;}
});

    const ar={...DEFAULT_ARENA,...(s.arena||{})};delete ar.title;

}

function firebaseStore(base){
  return{
    set:(col,id,d)=>base.child(col+'/'+id).set(clone(d)),
    del:(col,id)=>base.child(col+'/'+id).remove(),
    sub:(col,cb,err)=>{const r=base.child(col),cache={};let ready=false,t=null;
      const emit=()=>{t=null;cb({docs:Object.keys(cache).map(id=>({id,data:()=>cache[id]})),metadata:{fromCache:false}});};
      const bump=()=>{if(ready&&!t)t=setTimeout(emit,30);};const fail=e=>err&&err({code:'unavailable',message:String(e&&e.message)});
      r.on('child_added',x=>{cache[x.key]=x.val();bump();},fail);r.on('child_changed',x=>{cache[x.key]=x.val();bump();});r.on('child_removed',x=>{delete cache[x.key];bump();});
      r.once('value',()=>{ready=true;emit();},fail);return()=>r.off();},
  };
}
function firebaseRoom(base,tabKey,uidv){
  const me={};let arr=[],cbs=[],pending=false,last=0,live=false;const ref=base.child('presence/'+tabKey);
  const write=()=>{pending=false;last=Date.now();if(live)ref.set({...clone(me),_t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});};
  firebase.database().ref('.info/connected').on('value',s=>{live=!!s.val();if(live){ref.onDisconnect().remove();write();}const st=$('status');if(st&&MODE==='shared'&&!live)st.innerHTML='<span class="dot"></span>Reconnecting…';else renderAvatars();});
  base.child('presence').on('value',s=>{const v=s.val()||{},now=Date.now();
    arr=Object.entries(v).filter(([k,p])=>p&&typeof p==='object').map(([k,p])=>({peer:k,by:p.uid||k,isMe:k===tabKey||p.uid===uidv,sameTab:k===tabKey,kind:'viewer',guest:false,presence:p,updatedAt:now}));
    if(!arr.some(p=>p.sameTab))arr.push({peer:tabKey,by:uidv,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:{...me},updatedAt:now});
    cbs.forEach(f=>f({peers:arr}));});
  return{
    presence(patch){for(const[k,v]of Object.entries(patch)){if(v===null||v===undefined)delete me[k];else me[k]=v;}
      if(!pending){pending=true;setTimeout(write,Math.max(0,50-(Date.now()-last)));}return Promise.resolve();},
    onPeers(f){cbs.push(f);setTimeout(()=>f({peers:arr}));return()=>{cbs=cbs.filter(x=>x!==f);};},
    peers:()=>arr,connected:()=>live,
  };
}

    <div class="btnrow"><button class="pri" id="nmOk">${first?'Join board':'Save'}</button>${first?'':'<button data-close>Cancel</button>'}</div>`);
  const ok=()=>{const v=$('nmIn').value.trim().slice(0,24);if(!v){$('nmIn').focus();return;}myName=v;lsSet('ffxiv-board-name',v);sendPresence({name:v});closeModal();renderAvatars();};
  $('nmOk').onclick=ok;$('nmIn').onkeydown=e=>{if(e.key==='Enter')ok();};setTimeout(()=>$('nmIn').focus(),30);
}
async function init(){
  updUndo();renderTools();updStatus(0);
  dl=browserDownloads;
  myId=lsGet('ffxiv-board-uid');if(!myId){myId='u'+uid();lsSet('ffxiv-board-uid',myId);}
  const configured=window.firebase&&FIREBASE_CONFIG&&FIREBASE_CONFIG.databaseURL;
  if(configured){
    try{firebase.initializeApp(FIREBASE_CONFIG);const base=firebase.database().ref('boards/'+BOARD);
      store=firebaseStore(base);room=firebaseRoom(base,'t'+uid(),myId);MODE='shared';}
    catch(e){console.error(e);store=localStore();MODE='local';room=null;}
  } else {store=localStore();MODE='local';room=null;}
  if(MODE==='shared'&&!myName)setTimeout(()=>askName(true),300);
  if(MODE==='local'&&store.isEmpty()){seedLocal();}
  loadTimer=setTimeout(()=>{if(MODE==='shared'){const b=$('banner');b.textContent='Can’t reach the shared board yet — showing what’s cached. It will update when the connection returns.';b.classList.add('on');$('loading').style.display='none';}},10000);
  const err=e=>{if(e&&e.code==='revoked'){setReadOnly(true);}else toast('Lost connection to the shared board — reload to reconnect.');};
  store.sub('meta',onSnap('meta'),err);store.sub('fights',onSnap('fights'),err);store.sub('slides',onSnap('slides'),err);store.sub('items',onSnap('items'),err);
  if(!canWrite)setReadOnly(true);
  if(room){
    sendPresence({uid:myId,name:myName||'',color:myColor(),slide:curSlide,sel:[],cursor:null});
    room.onPeers(ch=>{peers=ch.peers.slice();resolveNames();if(following)applyFollow();renderAvatars();scheduleRender();scheduleThumbs();},()=>{});
  }
  updStatus(0);renderAll();
}
function seedLocal(){
  const sid='demo';const A={...DEFAULT_ARENA};
  store.set('slides',sid,{id:sid,title:'Slide 1',order:1,arena:A});
  let z=1;const put=(type,extra)=>{const id=uid();store.set('items',id,{id,slide:sid,type,x:100,y:100,z:z++,stroke:true,visible:true,locked:false,label:'',labelSize:1.5,...clone(DEF[type]),...extra});};
  const P=(d,a)=>({x:r2(100+d*Math.sin(a*Math.PI/180)),y:r2(100-d*Math.cos(a*Math.PI/180))});
  [['A',0],['1',45],['B',90],['2',135],['C',180],['3',225],['D',270],['4',315]].forEach(([m,a])=>put('waymark',{mark:m,name:'Waymark '+m,...P(15,a)}));
  put('cone',{name:'Frontal cleave',rot:180});put('boss',{});
}
init();
</script>
